[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theorica-autonomous-science"
version = "0.5.0"
description = "Compositional theory synthesis and experiment design for autonomous scientific discovery under realistic experimental faults."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=7"]
frontier = ["openai>=1.0"]

[project.scripts]
theorica = "theorica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
