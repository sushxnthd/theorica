name: representation-closure-holdout

on:
  workflow_dispatch:
  push:
    branches:
      - breakthrough-representation-closure
    paths:
      - "src/theorica/agents/representation_closure.py"
      - "scripts/representation_closure_holdout.py"
      - "tests/test_representation_closure.py"
      - "docs/REPRESENTATION_CLOSURE_PREREGISTRATION.md"
      - ".github/workflows/representation_closure_holdout.yml"

jobs:
  frozen-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_representation_closure.py
      - run: python scripts/representation_closure_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: representation-closure-holdout
          path: results/representation_closure_holdout.json
