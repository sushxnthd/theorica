name: translation-action-corruption-challenge

on:
  workflow_dispatch:
  push:
    paths:
      - "src/theorica/agents/translation_action.py"
      - "scripts/export_gap_translation_challenge_v1_1.g"
      - "scripts/translation_action_corruption_challenge.py"
      - ".github/workflows/translation_action_corruption_challenge.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Install GAP and SmallGrp
        run: |
          sudo apt-get update
          sudo apt-get install -y gap gap-smallgrp
      - name: Install pinned RightQuasigroups
        run: |
          mkdir -p "$HOME/.gap/pkg"
          git clone --depth 1 --branch v0.9.12             https://github.com/gap-packages/RightQuasigroups.git             "$HOME/.gap/pkg/RightQuasigroups"
      - name: Export unchanged public corpus
        run: gap -q scripts/export_gap_translation_challenge_v1_1.g
      - name: Run sparse-corruption falsification
        run: python scripts/translation_action_corruption_challenge.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: translation-action-corruption-challenge
          path: results/translation_action_corruption_challenge.json
