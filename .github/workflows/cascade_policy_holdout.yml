name: Frozen cascade-policy ACDB holdout
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/cascade_policy_holdout.py"
      - ".github/workflows/cascade_policy_holdout.yml"
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          mkdir -p external
          git clone https://github.com/qpiai/Active-Causal-Discovery-Bench.git external/Active-Causal-Discovery-Bench
          git -C external/Active-Causal-Discovery-Bench checkout c9b3018967b6ce798f12add37120b79a963177ed
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e external/Active-Causal-Discovery-Bench
      - name: Verify frozen policy has not changed
        run: |
          git log -1 --format=%H -- src/theorica/causal/cascade_policy.py
          test "$(git log -1 --format=%H -- src/theorica/causal/cascade_policy.py)" = "bbe5b0971c71faf8481c18aeda3194a91a2e92da"
      - run: python scripts/cascade_policy_holdout.py
      - run: |
          sha256sum src/theorica/causal/cascade_policy.py scripts/cascade_policy_holdout.py > FROZEN_CASCADE_SHA256.txt
          git rev-parse HEAD > repository_commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-cascade-acdb-holdout
          path: |
            results/frozen/cascade_policy_holdout.json
            FROZEN_CASCADE_SHA256.txt
            repository_commit.txt
