name: external-translation-action-holdout

on:
  workflow_dispatch:
  push:
    paths:
      - "src/theorica/agents/translation_action.py"
      - "tests/test_translation_action.py"
      - "scripts/external_translation_action_holdout.py"
      - ".github/workflows/external_translation_action_holdout.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_translation_action.py
      - run: python scripts/external_translation_action_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: external-translation-action-holdout
          path: results/external_translation_action.json
