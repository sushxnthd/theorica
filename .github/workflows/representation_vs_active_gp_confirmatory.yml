name: representation-vs-active-gp-confirmatory

on:
  workflow_dispatch:
  push:
    paths:
      - "src/theorica/agents/equational_discovery.py"
      - "scripts/representation_vs_active_gp_confirmatory.py"
      - ".github/workflows/representation_vs_active_gp_confirmatory.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_equational_discovery.py
      - run: python scripts/representation_vs_active_gp_confirmatory.py
      - uses: actions/upload-artifact@v4
        with:
          name: representation-vs-active-gp-confirmatory
          path: results/representation_vs_active_gp_confirmatory.json
