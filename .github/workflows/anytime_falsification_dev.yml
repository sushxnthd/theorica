name: anytime-falsification-development

on:
  workflow_dispatch:
  push:
    branches:
      - breakthrough-eprocess-falsification
    paths:
      - "src/theorica/agents/anytime_falsification.py"
      - "scripts/anytime_falsification_dev.py"
      - ".github/workflows/anytime_falsification_dev.yml"

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/anytime_falsification_dev.py
