name: anytime-falsification-quick-dev
on:
  workflow_dispatch:
  push:
    branches: [breakthrough-eprocess-falsification]
    paths:
      - "scripts/anytime_falsification_quick.py"
      - ".github/workflows/anytime_falsification_quick.yml"
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/anytime_falsification_quick.py
