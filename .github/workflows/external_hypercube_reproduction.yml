name: external-hypercube-reproduction

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/external_hypercube_reproduction.py"
      - ".github/workflows/external_hypercube_reproduction.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python scripts/external_hypercube_reproduction.py
      - uses: actions/upload-artifact@v4
        with:
          name: external-hypercube-reproduction
          path: results/external_hypercube_reproduction.json
