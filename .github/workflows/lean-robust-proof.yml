name: Lean robust translation proof

on:
  push:
    branches:
      - research/robust-translation-proof
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          lint: false
          nanoda: true
          nanoda-allow-sorry: false
