name: Native DiscoverPhysics force-map evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/discoverphysics_native_forcemap.py"
      - ".github/workflows/native_discoverphysics_forcemap.yml"
permissions:
  contents: read
jobs:
  discoverphysics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Clone pinned DiscoverPhysics
        run: |
          mkdir -p external
          git clone https://github.com/SampsonML/DiscoverPhysics.git external/DiscoverPhysics
          git -C external/DiscoverPhysics checkout 33b7fa9df96de9c35744efd181ca7e5a8dd60ad5
          git -C external/DiscoverPhysics rev-parse HEAD | tee discoverphysics_commit.txt
      - name: Install external benchmark
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e external/DiscoverPhysics/PhysicsSchool
          python -m pip install -e external/DiscoverPhysics/ScienceAgent
      - name: Run generic 15-experiment discovery
        run: python scripts/discoverphysics_native_forcemap.py
      - name: Provenance
        run: |
          python -V > python_version.txt
          pip freeze > pip_freeze.txt
          sha256sum scripts/discoverphysics_native_forcemap.py > adapter_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: theorica-native-discoverphysics-forcemap
          path: |
            results/native/discoverphysics_forcemap.json
            discoverphysics_commit.txt
            adapter_sha256.txt
            python_version.txt
            pip_freeze.txt
