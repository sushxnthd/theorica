name: operator-induction-holdout

on:
  workflow_dispatch:
  push:
    paths:
      - "src/theorica/agents/operator_induction.py"
      - "src/theorica/agents/symbolic_synthesis.py"
      - "scripts/operator_induction_holdout.py"
      - "tests/test_operator_induction.py"
      - ".github/workflows/operator_induction_holdout.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_operator_induction.py
      - run: python scripts/operator_induction_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: operator-induction-holdout
          path: results/operator_induction_holdout.json
