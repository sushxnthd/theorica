name: equational-discovery-holdout

on:
  workflow_dispatch:
  push:
    paths:
      - "src/theorica/agents/equational_discovery.py"
      - "tests/test_equational_discovery.py"
      - "scripts/equational_discovery_holdout.py"
      - ".github/workflows/equational_discovery_holdout.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/test_equational_discovery.py
      - run: python scripts/equational_discovery_holdout.py
      - uses: actions/upload-artifact@v4
        with:
          name: equational-discovery-holdout
          path: results/equational_discovery_holdout.json
