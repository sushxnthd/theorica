name: robust-provenance-query-frontier

on:
  push:
    branches: [breakthrough-engine/nonfaithful-reconstruction-boundary-20261013]
    paths:
      - docs/ROBUST_PROVENANCE_QUERY_FRONTIER_*.md
      - src/theorica/agents/robust_provenance.py
      - scripts/verify_robust_provenance_query_frontier.py
      - scripts/audit_robust_provenance_query_frontier.py
      - results/robust_provenance_query_frontier_*.json
      - tests/test_robust_provenance.py
      - .github/workflows/robust-provenance-query-frontier.yml
  pull_request:
    paths:
      - docs/ROBUST_PROVENANCE_QUERY_FRONTIER_*.md
      - src/theorica/agents/robust_provenance.py
      - scripts/verify_robust_provenance_query_frontier.py
      - scripts/audit_robust_provenance_query_frontier.py
      - results/robust_provenance_query_frontier_*.json
      - tests/test_robust_provenance.py
      - .github/workflows/robust-provenance-query-frontier.yml
  workflow_dispatch:

jobs:
  exact-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e '.[dev]'
      - name: Runtime regression
        run: python -m pytest -q tests/test_robust_provenance.py
      - name: Exact primary and independent audit
        run: |
          python scripts/verify_robust_provenance_query_frontier.py --output /tmp/primary.json
          python scripts/audit_robust_provenance_query_frontier.py /tmp/primary.json --output /tmp/audit.json
          cmp /tmp/primary.json results/robust_provenance_query_frontier_primary.json
          cmp /tmp/audit.json results/robust_provenance_query_frontier_audit.json
      - name: Byte-identical rerun
        run: |
          python scripts/verify_robust_provenance_query_frontier.py --output /tmp/primary-2.json >/dev/null
          cmp /tmp/primary.json /tmp/primary-2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robust-provenance-query-frontier
          path: |
            /tmp/primary.json
            /tmp/audit.json
